<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <linearGradient id="banana-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.8"/>
  
  <!-- Nano Lattice Orbit Ring -->
  <ellipse cx="32" cy="32" rx="25" ry="13" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.45" transform="rotate(-28 32 32)"/>
  <circle cx="13" cy="21" r="1.5" fill="#38bdf8" filter="url(#neon-glow)"/>
  <circle cx="51" cy="43" r="1.3" fill="#a855f7" filter="url(#neon-glow)"/>

  <!-- Banana Silhouette Curve -->
  <path d="M 18,17 C 22,13 28,15 30,17 C 38,21 48,32 46,45 C 44,52 35,55 26,49 C 20,45 15,36 17,26 C 17.5,23 18,20 18,17 Z"
        fill="url(#banana-grad)" stroke="#f59e0b" stroke-width="0.8"/>

  <!-- Banana Inner Shading / Ridge -->
  <path d="M 20,18 C 24,24 23,37 32,46 C 38,50 43,47 45,43 C 43,32 35,23 27,18 Z"
        fill="#f59e0b" opacity="0.25"/>

  <!-- High-tech Stem -->
  <path d="M 18,17 L 14,13 L 16,11 L 20,15 Z" fill="#10b981" stroke="#059669" stroke-width="0.5"/>
  <circle cx="15" cy="12" r="1" fill="#6ee7b7"/>
  <!-- High-tech Bottom Tip -->
  <path d="M 46,45 L 49,48 L 47,50 L 44,47 Z" fill="#334155"/>

  <!-- Nanoscale Circuit Traces on the Banana -->
  <path d="M 22,23 L 26,26 L 33,26 L 37,31" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round" filter="url(#neon-glow)"/>
  <circle cx="22" cy="23" r="1.4" fill="#38bdf8"/>
  <circle cx="33" cy="26" r="1.2" fill="#38bdf8"/>
  <circle cx="37" cy="31" r="1.4" fill="#a855f7"/>

  <path d="M 25,35 L 30,35 L 34,40 L 40,40" fill="none" stroke="#9333ea" stroke-width="1" stroke-linecap="round" filter="url(#neon-glow)"/>
  <circle cx="25" cy="35" r="1.2" fill="#38bdf8"/>
  <circle cx="34" cy="40" r="1.2" fill="#c084fc"/>
  <circle cx="40" cy="40" r="1.4" fill="#38bdf8"/>

  <!-- Nano Particle Sparks -->
  <circle cx="32" cy="15" r="1" fill="#fef08a"/>
  <circle cx="45" cy="23" r="1.2" fill="#38bdf8" filter="url(#neon-glow)"/>
  <circle cx="23" cy="43" r="0.9" fill="#a855f7"/>
</svg>
